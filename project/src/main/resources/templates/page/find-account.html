<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{UI/layouts/user/login_layout}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계정 찾기 - 스마트 농업 관제 시스템</title>
</head>
<body layout:fragment="content">

  <main class="login-page">
    <section class="login-card">
      <header class="login-brand">
        <div class="login-brand-logo">A</div>
        <h1>아이디 / 비밀번호 찾기</h1>
        <p>가입 시 등록한 정보를 입력해 주세요.</p>
      </header>

      <!-- 에러 또는 결과 메시지 출력 공간 -->
      <div th:if="${errorMessage}" class="page-flash is-error" style="color: red; margin-bottom: 15px; text-align: center;">
        <p th:text="${errorMessage}"></p>
      </div>

      <!-- 아이디 찾기 폼 -->
      <form class="login-form" th:action="@{/find-id}" method="post" style="margin-bottom: 30px;">
        <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: #333;">아이디(이메일) 찾기</h3>
        <div class="login-field">
          <label for="nameForId">이름</label>
          <input id="nameForId" name="name" type="text" placeholder="가입한 이름을 입력하세요" required>
        </div>
        <!-- 전화번호나 기타 확인용 필드가 있다면 추가 가능 -->
        <button type="submit" class="login-submit" style="margin-top: 10px;">아이디 찾기</button>
        
        <!-- 아이디 찾기 결과 표시 -->
        <div th:if="${foundEmail}" style="margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px; text-align: center;">
          회원님의 아이디(이메일)는 <strong th:text="${foundEmail}" style="color: #2b7a78;"></strong> 입니다.
        </div>
      </form>

      <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

      <!-- 비밀번호 찾기 폼 -->
      <form class="login-form" th:action="@{/find-password}" method="post">
        <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: #333;">비밀번호 찾기</h3>
        <div class="login-field">
          <label for="emailForPw">아이디(이메일)</label>
          <input id="emailForPw" name="email" type="email" placeholder="가입한 이메일을 입력하세요" required>
        </div>
        <div class="login-field">
          <label for="nameForPw">이름</label>
          <input id="nameForPw" name="name" type="text" placeholder="이름을 입력하세요" required>
        </div>
        <button type="submit" class="login-submit" style="margin-top: 10px;">임시 비밀번호 발급</button>

        <!-- 비밀번호 찾기 결과 표시 -->
        <div th:if="${pwMessage}" style="margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px; text-align: center;">
          <p th:text="${pwMessage}" style="color: #2b7a78; font-size: 0.9rem;"></p>
        </div>
      </form>

      <div class="login-signup-link" style="margin-top: 20px;">
        기억나셨나요? <a th:href="@{/login}">로그인하기</a>
      </div>
    </section>
  </main>

</body>
</html>
