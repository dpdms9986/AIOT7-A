<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{UI/layouts/user/login_layout}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계정을 잊으셨나요? - 스마트 농업 관제 시스템</title>
</head>
<body layout:fragment="content">

  <main class="login-page">
    <section class="login-card">
      <header class="login-brand">
        <div class="login-brand-logo">
          <img th:src="@{/images/header-logo.png}" alt="스마트 농업 드론 방제 시스템">
        </div>
        <h1>계정을 잊으셨나요?</h1>
        <p>가입 시 등록한 정보를 입력해 주세요.</p>
      </header>

      <!-- 탭: 컨트롤러가 내려주는 activeTab 으로 초기 탭 결정 (없으면 이메일 찾기) -->
      <div class="findaccount-tabs" role="tablist">
        <button type="button" role="tab" data-tab="id"
                th:classappend="${activeTab != 'password'} ? 'active'">이메일 찾기</button>
        <button type="button" role="tab" data-tab="password"
                th:classappend="${activeTab == 'password'} ? 'active'">비밀번호 찾기</button>
      </div>

      <!-- 에러 메시지 -->
      <div th:if="${errorMessage}" class="page-flash is-error">
        <p th:text="${errorMessage}"></p>
      </div>

      <!-- 아이디 찾기 -->
      <form class="login-form findaccount-panel" data-panel="id"
            th:action="@{/find-id}" method="post" th:hidden="${activeTab == 'password'}">
        <div class="login-field">
          <label for="nameForId">이름</label>
          <input id="nameForId" name="name" type="text" placeholder="가입한 이름을 입력하세요" required>
        </div>
        <div class="login-field">
          <label for="phoneForId">연락처 (선택)</label>
          <input id="phoneForId" name="phone" type="tel" placeholder="010-1234-5678" maxlength="13">
        </div>

        <button type="submit" class="login-submit">이메일 찾기</button>

        <div th:if="${searchSuccess}" class="findaccount-result">
          가입하신 이메일은 <strong th:text="${foundUsername}"></strong> 입니다.
        </div>
      </form>

      <!-- 비밀번호 찾기 -->
      <form class="login-form findaccount-panel" data-panel="password"
            th:action="@{/find-password}" method="post" th:hidden="${activeTab != 'password'}">
        <div class="login-field">
          <label for="emailForPw">이메일</label>
          <input id="emailForPw" name="email" type="email" placeholder="가입한 이메일을 입력하세요" required>
        </div>
        <div class="login-field">
          <label for="nameForPw">이름</label>
          <input id="nameForPw" name="name" type="text" placeholder="가입한 이름을 입력하세요" required>
        </div>

        <button type="submit" class="login-submit">임시 비밀번호 발급</button>

        <!-- 메일 발송 성공 -->
        <div th:if="${pwSuccess}" class="findaccount-result">
          <span th:text="${message}"></span>
        </div>
        <!-- 메일 발송 실패 (pwSuccess 없이 message 만 내려옴) -->
        <div th:if="${message != null and pwSuccess == null}" class="page-flash is-error">
          <p th:text="${message}"></p>
        </div>
      </form>

      <div class="login-signup-link">
        기억나셨나요? <a th:href="@{/login}">로그인하기</a>
      </div>
    </section>
  </main>

  <script th:src="@{/js/users/find-account.js}"></script>
</body>
</html>
