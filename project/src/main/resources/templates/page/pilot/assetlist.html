<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{UI/layouts/user/pilot_layout}">
<head>
  <meta charset="UTF-8">
  <title>드론 · 약제 | 스마트 농업 관제 시스템</title>
</head>
<body layout:fragment="content">

<main class="dash-main pilot-asset-page">

  <!-- 페이지 제목 -->
  <section class="page-heading asset-page-heading">
    <div class="page-heading-icon" aria-hidden="true"><img th:src="@{/img/drone-icon.png}" alt="" class="asset-icon-img"></div>
    <div>
      <h1>드론 · 약제 관리</h1>
      <p>내 소유 드론과 담당 약제, 정비 상태를 관리합니다.</p>
    </div>
    <button type="button" class="asset-pilot-register-button" id="open-asset-register">+ 자산 등록</button>
  </section>

  <!-- 탭: 링크 -->
  <section class="asset-pilot-tabs" aria-label="자산 종류 선택">
    <a class="asset-pilot-tab" th:classappend="${tab == 'all'} ? 'active'"
       th:href="@{/pilot/assetlist(tab='all')}">전체 자산</a>
    <a class="asset-pilot-tab" th:classappend="${tab == 'drone'} ? 'active'"
       th:href="@{/pilot/assetlist(tab='drone')}">드론 기체</a>
    <a class="asset-pilot-tab" th:classappend="${tab == 'chemical'} ? 'active'"
       th:href="@{/pilot/assetlist(tab='chemical')}">농업용 약제</a>
  </section>

  <!-- 요약 -->
  <section class="asset-pilot-summary" aria-label="내 자산 요약">
    <article class="asset-pilot-stat">
      <div class="asset-pilot-stat-icon drone"><img th:src="@{/img/header-logo.png}" alt="" class="asset-icon-img"></div>
      <div>
        <span>내 드론 기체</span>
        <strong th:text="${droneCount} + '대'">0대</strong>
        <small>배정된 기체</small>
      </div>
    </article>
    <article class="asset-pilot-stat">
      <div class="asset-pilot-stat-icon chemical">🧪</div>
      <div>
        <span>담당 약제 품목</span>
        <strong th:text="${chemicalCount} + '종'">0종</strong>
        <small>내 담당 재고</small>
      </div>
    </article>
    <article class="asset-pilot-stat">
      <div class="asset-pilot-stat-icon maintenance">🔧</div>
      <div>
        <span>정비 필요</span>
        <strong th:text="${maintenanceCount} + '건'">0건</strong>
        <small>확인이 필요한 기체</small>
      </div>
    </article>
  </section>

  <!-- 자산 목록 -->
   <section class="asset-pilot-list-card">

  <div class="asset-pilot-list-heading">
  <div>
    <h2 th:text="${tabTitle}">전체 자산</h2>
    <p>본인에게 배정된 자산만 표시됩니다.</p>
  </div>
  <span>총 <strong th:text="${pagination.total}">0</strong>건</span>
  </div>

        <!-- 검색 (GET) : 자산 유형은 전체 탭에서만 / 순서는 단장 화면과 같게 (유형 → 상태 → 검색어) -->
    <form class="asset-pilot-filters is-pilot" th:classappend="${tab != 'all'} ? 'no-type'"
          th:action="@{/pilot/assetlist}" method="get">
      <input type="hidden" name="tab" th:value="${tab}">
      <label th:if="${tab == 'all'}">
        자산 유형
        <select name="type">
          <option value="">전체</option>
          <option value="drone"    th:selected="${type == 'drone'}">드론 기체</option>
          <option value="chemical" th:selected="${type == 'chemical'}">농업용 약제</option>
        </select>
      </label>

      <label>
        상태
        <select name="status" id="asset-search-status">
          <option value="">전체</option>
          <!-- 탭에 맞는 상태만 (컨트롤러가 골라서 보냄) -->
          <option th:each="s : ${statusOptions}" 
                  th:value="${s.key}" 
                  th:text="${s.value}"
                  th:selected="${s.key == status}"
                  th:attr="data-asset-type=${s.key == 'normal' ? 'both' : (s.key == 'low' ? 'chemical' : 'drone')}">정상</option>
        </select>
      </label>

      <label class="asset-pilot-keyword">
        검색어
        <input type="search" name="keyword" th:value="${keyword}" placeholder="자산명, 모델명, 약제명 검색">
      </label>
      <button type="submit" class="asset-pilot-search-button">검색</button>
      <a class="asset-pilot-reset-button" th:href="@{/pilot/assetlist(tab=${tab})}">초기화</a>
    </form>

    <!-- 표 (담당 조종사 칸 없음) -->
    <div class="asset-pilot-table-scroll">
      <table class="asset-pilot-table">
        <thead>
          <tr>
            <th>자산 유형</th>
            <th>이름 / 모델명</th>
            <th>상태</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="a : ${assets}">
            <td th:text="${a.typeLabel}">🚁 드론</td>
            <td>
              <strong th:text="${a.name}">DJI Agras T40</strong>
              <small th:if="${!a.drone and a.subtitle != null and !#strings.isEmpty(a.subtitle)}"
                 th:text="${a.subtitle}">
               분류: 살균제
             </small>
            </td>
            <td><span class="asset-pilot-badge" th:classappend="${a.status}" th:text="${a.statusLabel}">정상</span></td>
            <td>

            <div class="asset-row-actions">
              <details class="asset-row-change">
              <summary class="asset-pilot-detail-button">변경</summary>

              <form th:action="@{/pilot/assetlist/{id}/status(id=${a.id})}" method="post">
              <select name="status" required>
              <option th:each="s : ${a.statusOptions}"
                th:value="${s.key}"
                th:text="${s.value}"
                th:selected="${s.key == a.status}">
               정상
             </option>
             </select>
             <button type="submit" class="asset-pilot-search-button">적용</button>
             </form>
             </details>

             <form th:action="@{/pilot/assetlist/{id}/delete(id=${a.id})}" method="post"
                onsubmit="return confirm('이 자산을 삭제하시겠습니까?');">
              <button type="submit" 
                     class="asset-pilot-detail-button asset-row-delete-button">삭제</button>
             </form>
            </div>
              </td>
            </tr>

          <tr th:if="${#lists.isEmpty(assets)}">
            <td colspan="4" class="asset-pilot-empty">조건에 맞는 자산이 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 페이지 번호 -->
    <div class="um-pager" th:if="${pagination.total > 10}">
    <a th:href="@{/pilot/assetlist(page=1, size=10, tab=${tab}, type=${type}, status=${status}, keyword=${keyword})}">«</a>

    <a th:each="p : ${#numbers.sequence(pagination.start, pagination.end)}"
       th:href="@{/pilot/assetlist(page=${p}, size=10, tab=${tab}, type=${type}, status=${status}, keyword=${keyword})}"
       th:classappend="${p == pagination.page} ? 'on'"
       th:text="${p}">1</a>

     <a th:href="@{/pilot/assetlist(page=${pagination.last}, size=10, tab=${tab}, type=${type}, status=${status}, keyword=${keyword})}">»</a>
      </div>
      </section>

  </main>
 
        
<!-- ===== 자산 등록 팝업 (POST → AssetCreateRequest) ===== -->
<div class="asset-register-modal" id="asset-register-modal" hidden>
  <section class="asset-register-modal-content"
           role="dialog"
           aria-modal="true"
           aria-labelledby="asset-register-title">

    <div class="asset-register-modal-heading">
      <div>
        <h2 id="asset-register-title">자산 등록</h2>
        <p>새 드론 기체나 약제를 등록합니다.</p>
      </div>

      <button type="button"
              class="asset-register-modal-close"
              id="close-asset-register"
              aria-label="닫기">×</button>
    </div>

    <form th:action="@{/pilot/assetlist}" method="post">
      <div class="asset-register-form-grid">

        <label>자산 유형
          <select id="asset-type" name="type" required>
            <option value="drone">드론 기체</option>
            <option value="chemical">농업용 약제</option>
          </select>
        </label>

        <label>
          <span id="asset-name-label">이름 / 모델명</span>
          <input type="text"
                 id="asset-name"
                 name="name"
                 placeholder="예) DJI Agras T50"
                 required>
        </label>

        <label>
          <span id="asset-subtitle-label">설명 / 분류</span>
          <input type="text"
                 id="asset-subtitle"
                 name="subtitle"
                 placeholder="예) 분류: 살균제">
        </label>

        <label>상태
  <select id="asset-status" name="status" required>
    <option th:each="s : ${allStatusOptions}"
            th:value="${s.key}"
            th:text="${s.value}"
            th:attr="data-asset-type=${s.key == 'normal' ? 'both' : (s.key == 'low' ? 'chemical' : 'drone')}">
    </option>
  </select>
</label>

      </div>

      <div class="asset-register-modal-actions">
        <button type="button"
                class="asset-register-button asset-register-button-outline"
                id="cancel-asset-register">취소</button>

        <button type="submit"
                class="asset-register-button asset-register-button-primary">등록</button>
      </div>
    </form>
  </section>
</div>  


<!-- 공통 팝업 불러오기 -->
<th:block th:replace="~{UI/fragments/user/toast :: toast}"></th:block>

<script th:src="@{/js/pilot/assetlist.js}"></script>


</body>
</html>
