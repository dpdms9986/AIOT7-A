<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{UI/layouts/user/pilot_layout}">
<head>
    <title>조종사 대시보드</title>

    <!-- 이 페이지 전용: jQuery, 웹소켓(SockJS, STOMP), 지도(Leaflet) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<th:block layout:fragment="content">
    <main class="dash-main">
        <!-- 제목 -->
        <div class="dash-title-row">
            <div>
                <h1>🚁 작업 현황</h1>
                <p>배정된 작업과 농지 위치를 확인하세요.</p>
            </div>
        </div>

        <section class="pilot-layout">

            <!-- 왼쪽: 지도 -->
            <article class="dash-card">
                <div class="dash-card-head">
                    <h2>🗺 내 작업 지도</h2>
                    <span id="status" class="ws-status">
                        <i data-lucide="radio-tower"></i>
                        <span class="status-text">현재 상태: 연결 대기 중</span>
                    </span>
                </div>

                <!-- 실시간 GPS 전송 조작 패널 -->
                <div class="gps-control-bar">

                    <!-- 로그인한 조종사의 팀 채널 키 -->
                    <input type="hidden" id="teamChannelKey"
                           th:value="${myTeamChannel}">

                    <!-- 로그인한 조종사 본인 식별 -->
                    <input type="hidden" id="myPilotName"
                           th:value="${myPilotName}">

                    <!-- 소속 방제단 표시 -->
                    <div class="team-info-badge">
                        <i data-lucide="drone"></i>
                        <strong th:text="${myTeamName != null ? myTeamName : '방제단 미배속'}">
                            방제단 명칭
                        </strong>
                    </div>

                    <span class="control-divider"></span>

                    <!-- 기존 GPS 조작 기능 유지 -->
                    <button type="button" class="gps-btn"
                            onclick="startFakeAuto()">
                        <i data-lucide="plane"></i>
                        가상 비행
                    </button>

                    <button type="button" class="gps-btn btn-real"
                            onclick="startRealGpsAuto()">
                        <i data-lucide="map-pin"></i>
                        실제 GPS 시작
                    </button>

                    <button type="button" class="gps-btn btn-pause"
                            onclick="pauseWork()">
                        <i data-lucide="pause"></i>
                        일시정지
                    </button>

                <div id="autoStatus" class="gps-status-text"></div>
               </div>


                <div class="pilot-map" id="pilot-map"></div>

                <ul class="dash-legend">
                    <li><i class="lg-ready"></i>READY 배정 전</li>
                    <li><i class="lg-assigned"></i>ASSIGNED 대기</li>
                    <li><i class="lg-progress"></i>IN_PROGRESS 진행 중</li>
                    <li><i class="lg-completed"></i>COMPLETED 완료</li>
                    <li><i class="lg-interrupted"></i>INTERRUPTED 중단됨</li>
                </ul>
            </article>

            <!-- 오른쪽: 내 작업 목록 -->
            <article class="dash-card">
                <div class="dash-card-head">
                    <h2>📋 내 작업 목록</h2>
                </div>

                <!-- 작업 상태 탭 -->
                <div class="pilot-tabs" id="pilot-tabs">
                    <button type="button"
                            class="active"
                            data-filter="active">
                        작업중
                    </button>

                    <button type="button"
                            data-filter="stopped">
                        중단 및 인계
                    </button>
                </div>

                <!-- 서버가 전체 작업을 렌더링하고 JS가 탭별로 필터링 -->
                <ul class="pilot-task-list" id="pilot-task-list"
                    th:data-selected="${selectedNo}">

                    <li th:each="t : ${myTasks}"
                    th:data-group="${t.status == 'ASSIGNED' or t.status == 'IN_PROGRESS' ? 'active' : 'stopped'}"
                    th:data-status="${t.status}">

                        <button type="button"
                                class="pilot-task"
                                th:classappend="${t.no == selectedNo} ? 'selected'"
                                th:data-no="${t.no}"
                                th:data-address="${t.address}"
                                th:data-status="${t.status}"
                                th:data-area="${t.areaSize}"
                                th:data-lat="${t.latitude}"
                                th:data-lng="${t.longitude}"
                                th:data-color="${t.stColor}"
                                th:data-polygon="${t.polygonCoordinates}"
                                th:data-flight-path="${t.flightPath}"
                                th:data-assigned-geometry="${t.assignedGeometry}"
                                th:data-completed-at="${t.completedAt}"
                                th:data-assigned-at="${t.assignedAt}">

                            <span class="pilot-dot"
                                th:classappend="${t.stClass}"></span>

                            <span class="pilot-task-body">
                                <strong th:text="${t.address}">전민동 31-7</strong>

                                <small th:text="${#numbers.formatDecimal(t.areaSize, 0, 'COMMA', 0, 'POINT')} + '㎡ · ' + ${#temporals.format(t.assignedAt, 'MM-dd HH:mm')}">
                                    4,800㎡ · 10-29 08:00
                                </small>
                            </span>

                            <span class="pilot-status"
                                th:classappend="${t.stClass}"
                                th:text="${t.statusLabel}">
                                작업 중
                            </span>

                        </button>
                    </li>
                </ul>
                <p class="pilot-empty" id="pilot-task-empty"
                   th:hidden="${not #lists.isEmpty(myTasks)}">
                    해당하는 작업이 없습니다.
                </p>
            </article>
        </section>
    </main>

    <!-- 지도에만 표시할 주변 미배정 농지 → JS 배열로 넘김 -->
    <script th:inline="javascript">
        const OTHER_FARMS = /*[[${otherFarms}]]*/ [];
    </script>

    <!-- 순서 중요: 지도·웹소켓(map 생성) → 위험 마커 → 작업 목록(map 사용) -->
    <script th:src="@{/js/pilot/pilot-gps.js}"></script>
    <script th:src="@{/js/common/hazard-markers.js}"></script>
    <script th:src="@{/js/pilot/pilot-tasks.js}"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (window.lucide) {
            lucide.createIcons();
        } else {
            console.error("Lucide 라이브러리를 불러오지 못했습니다.");
        }
    </script>
</th:block>
</body>
</html>
