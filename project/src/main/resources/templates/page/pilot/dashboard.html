<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{UI/layouts/user/pilot_layout}">
<head>
    <title>조종사 대시보드</title>

    <!-- 이 페이지 전용: jQuery, 웹소켓(SockJS, STOMP), 지도(Leaflet) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<th:block layout:fragment="content">
    <main class="dash-main">
        <!-- 제목 -->
        <div class="dash-title-row">
            <div>
                <h1>🚁 작업 현황</h1>
                <p>배정된 작업과 농지 위치를 확인하세요.</p>
            </div>
        </div>

        <section class="pilot-layout">

            <!-- 왼쪽: 지도 -->
            <article class="dash-card">
                <div class="dash-card-head">
                    <h2>🗺 내 작업 지도</h2>
                    <span id="status" class="ws-status">현재 상태: 연결 대기 중</span>
                </div>

                <!-- 실시간 GPS 전송 조작 패널 -->
                <div class="gps-control-bar">
                    <label>방제단 번호:</label>
                    <input type="number" id="teamNoInput" value="1" style="width: 45px;">
                    <label>조종사명:</label>
                    <input type="text" id="pilotName" value="" style="width: 80px;">

                    <button type="button" class="gps-btn" onclick="connect()">🔌 채널 연결</button>
                    <button type="button" class="gps-btn" onclick="startFakeAuto()">✈️ 가상 비행</button>
                    <button type="button" class="gps-btn btn-real" onclick="startRealGpsAuto()">📱 실제 GPS 시작</button>
                    <button type="button" class="gps-btn btn-stop" onclick="stopAuto()">⏹️ 중지</button>

                    <div id="autoStatus" class="gps-status-text"></div>
                </div>

                <div class="pilot-map" id="pilot-map"></div>

                <ul class="dash-legend">
                    <li><i style="background: #238451;"></i>READY 배정 전</li>
                    <li><i style="background: #f2b705;"></i>ASSIGNED 대기</li>
                    <li><i style="background: #2f80ed;"></i>IN_PROGRESS 진행 중</li>
                    <li><i style="background: #8a8f8c;"></i>COMPLETED 완료</li>
                </ul>
            </article>

            <!-- 오른쪽: 내 작업 목록 -->
            <article class="dash-card">
                <div class="dash-card-head">
                    <h2>📋 내 작업 목록</h2>
                </div>

                <div class="pilot-tabs" id="pilot-tabs">
                    <button type="button" class="active" data-filter="all">전체</button>
                    <button type="button" data-filter="active">진행 중</button>
                    <button type="button" data-filter="done">완료</button>
                </div>

                <!-- [추가] 내 작업 목록: 서버가 전부 그리고, 탭 필터는 JS가 보였다/숨겼다 -->
                <ul class="pilot-task-list" id="pilot-task-list" th:data-selected="${selectedNo}">
                    <li th:each="t : ${myTasks}"
                        th:data-group="${t.status == 'COMPLETED'} ? 'done' : 'active'">
                        <button type="button" class="pilot-task"
                                th:classappend="${t.no == selectedNo} ? 'selected'"
                                th:data-no="${t.no}"
                                th:data-address="${t.address}"
                                th:data-status="${t.statusLabel}"
                                th:data-area="${t.areaSize}"
                                th:data-lat="${t.latitude}"
                                th:data-lng="${t.longitude}"
                                th:data-color="${t.stColor}">
                            <span class="pilot-dot" th:classappend="${t.stClass}"></span>
                            <span class="pilot-task-body">
                                <strong th:text="${t.address}">전민동 31-7</strong>
                                <small th:text="${#numbers.formatDecimal(t.areaSize, 0, 'COMMA', 0, 'POINT')} + '㎡ · ' + ${#temporals.format(t.assignedAt, 'MM-dd HH:mm')}">4,800㎡ · 10-29 08:00</small>
                            </span>
                            <span class="pilot-status" th:classappend="${t.stClass}" th:text="${t.statusLabel}">작업 중</span>
                        </button>
                    </li>
                </ul>
                <p class="pilot-empty" id="pilot-task-empty" th:hidden="${not #lists.isEmpty(myTasks)}">해당하는 작업이 없습니다.</p>
            </article>
        </section>
    </main>

    <!-- [추가] 지도에만 표시할 주변 미배정 농지 → JS 배열로 넘김 -->
    <script th:inline="javascript">
        const OTHER_FARMS = /*[[${otherFarms}]]*/ [];
    </script>

    <!-- 순서 중요: 지도·웹소켓(map 생성) → 작업 목록(map 사용) -->
    <script th:src="@{/js/pilot/pilot-gps.js}"></script>
    <!-- [교체] 없는 파일(pilot-dashboard.js) 대신 새로 만든 파일 -->
    <script th:src="@{/js/pilot/pilot-tasks.js}"></script>
</th:block>

</body>
</html>
