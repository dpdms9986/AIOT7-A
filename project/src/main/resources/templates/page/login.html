<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{UI/layouts/user/login_layout}"
      >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 농업 관제 시스템</title>
</head>
<body layout:fragment="content">

  <main class="login-page">
    <section class="login-card">
      <header class="login-brand">
        <div class="login-brand-logo">A</div>
        <h1>농업 드론 관제 시스템</h1>
        <p>계정에 로그인하여 관제 서비스를 이용하세요.</p>
      </header>

      <!-- [추가] 안내 메시지 -->
      <div th:if="${signupSuccess}" class="page-flash">
        회원가입이 완료되었습니다! 가입하신 정보로 로그인해주세요.
      </div>
      <div th:if="${param.logout != null}" class="page-flash is-info">
        정상적으로 로그아웃되었습니다.
      </div>

      <form class="login-form" id="login-form" th:action="@{/login}" method="post">
        <div class="login-field">
          <label for="username">이메일</label>
          <input id="username" name="username" th:value="${username}" type="email" placeholder="이메일을 입력하세요" required autofocus>
        </div>

        <div class="login-field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" required>
        </div>

        <div class="login-options">
          <label class="login-remember">
            <input type="checkbox" id="remember-id">
            아이디 비밀번호 기억하기
          </label>

          <label class="login-remember">
          <input type="checkbox" id="remember-me" name="rememberMe" value="true">
            자동 로그인
          </label>

          <a href="findaccount.html" class="login-link">계정 찾기</a>
        </div>

        <button type="submit" class="login-submit">로그인</button>
      </form>

      <div class="login-signup-link">
        계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
      </div>
    </section>
  </main>

  <script>
    // param.error가 존재하면 에러 메시지를 표시
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
      const errorMessage = urlParams.get('error');
      $alert('로그인 실패', errorMessage || '로그인에 실패했습니다. 다시 시도해주세요.', 'error');
    }

    // 아이디 값이 있으면 비밀번호 필드에 포커스
    if (document.getElementById('username').value.trim() !== '') {
      document.getElementById('password').focus();
    }
  </script>
  
</body>
</html>
