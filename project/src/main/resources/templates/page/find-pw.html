<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{UI/layouts/user/login_layout}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 찾기 - 스마트 농업 관제 시스템</title>
</head>
<body layout:fragment="content">

  <main class="login-page">
    <section class="login-card">
      <header class="login-brand">
        <div class="login-brand-logo">A</div>
        <h1>비밀번호 찾기</h1>
        <p>가입한 이메일과 이름을 입력해 주세요.</p>
      </header>

      <div th:if="${errorMessage}" class="page-flash is-error">
        <p th:text="${errorMessage}"></p>
      </div>

      <form class="login-form" th:action="@{/find-pw}" method="post">
        <div class="login-field">
          <label for="emailForPw">이메일</label>
          <input id="emailForPw" name="email" type="email" placeholder="가입한 이메일을 입력하세요" required autofocus>
        </div>
        <div class="login-field">
          <label for="nameForPw">이름</label>
          <input id="nameForPw" name="name" type="text" placeholder="가입한 이름을 입력하세요" required>
        </div>

        <button type="submit" class="login-submit">임시 비밀번호 발급</button>

        <div th:if="${pwMessage}" class="findaccount-result">
          <span th:text="${pwMessage}"></span>
        </div>
      </form>

      <div class="login-signup-link">
        아이디가 기억나지 않으세요? <a th:href="@{/find-id}">아이디 찾기</a>
      </div>
      <div class="login-signup-link">
        <a th:href="@{/login}">로그인으로 돌아가기</a>
      </div>
    </section>
  </main>

</body>
</html>
