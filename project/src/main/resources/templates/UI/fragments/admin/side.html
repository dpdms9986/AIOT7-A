<th:block th:fragment="side">
  <aside class="adm-side">
    <div class="adm-side-title">
      <span class="material-icons-outlined">eco</span>관리자 메뉴
    </div>

    <nav class="adm-menu">
      <a th:href="@{/admin}" th:classappend="${currentUri == '/admin'} ? 'active'">
        <span class="material-icons-outlined">home</span>전체 현황</a>
      <a th:href="@{/admin/users}" th:classappend="${#strings.startsWith(currentUri, '/admin/users')} ? 'active'">
        <span class="material-icons-outlined">group</span>사용자 관리</a>
      <a th:href="@{/admin/pilots}" th:classappend="${#strings.startsWith(currentUri, '/admin/pilots')} ? 'active'">
        <span class="material-icons-outlined">flight</span>조종사 관리</a>
      <a th:href="@{/admin/inquiries}" th:classappend="${#strings.startsWith(currentUri, '/admin/inquiries')} ? 'active'">
        <span class="material-icons-outlined">support_agent</span>문의현황</a>
      <a th:href="@{/hazards}">
        <span class="material-icons-outlined">article</span>게시판</a>
    </nav>

    <div class="adm-side-art"></div>

    <form th:action="@{/logout}" method="post" class="adm-logout">
      <button type="submit"><span class="material-icons-outlined">logout</span>로그아웃</button>
    </form>
  </aside>
</th:block>
