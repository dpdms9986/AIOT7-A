<th:block th:fragment="header">
  <header class="dash-header">
    <a th:href="@{/pilot/dashboard}" class="dash-logo"><span>🌱</span>스마트 농업 관제 시스템</a>

    <nav class="dash-topnav" id="gnb-menu">
      <a th:href="@{/pilot/dashboard}"
         th:classappend="${#strings.startsWith(currentUri, '/pilot/dashboard')} ? 'active'">내 할당 필지</a>
      <a th:href="@{/pilot/history}"
         th:classappend="${#strings.startsWith(currentUri, '/pilot/history')} ? 'active'">작업 이력</a>
      <a th:href="@{/pilot/assetlist}"
         th:classappend="${#strings.startsWith(currentUri, '/pilot/assetlist')} ? 'active'">드론 · 자산</a>
      <a th:href="@{/hazardlist}"
         th:classappend="${#strings.startsWith(currentUri, '/hazardlist')} ? 'active'">게시판</a>
      <a th:href="@{/support}"
         th:classappend="${#strings.startsWith(currentUri, '/support')} ? 'active'">고객센터</a>
    </nav>

    <div class="dash-header-right">
        <span class="gnb-team" th:text="${headerTeamName} ?: '방제단 없음'">방제단</span>
        <span class="dash-role" th:text="${roleLabel}">-</span>

        <a th:href="@{/mypage}" class="gnb-user" title="마이페이지">
          <span class="dash-avatar">👤</span><span th:text="${loginName}">사용자</span>
        </a>

        <form th:action="@{/logout}" method="post">
          <button type="submit" class="dash-btn-outline gnb-logout">로그아웃</button>
        </form>
    </div>
  </header>
</th:block>
