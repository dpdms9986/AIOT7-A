<th:block th:fragment="header">
  <header class="dash-header">
    <a th:href="@{/}" class="dash-logo" title="스마트 농업 관제 시스템"><span class="dash-logo-img">
      <img th:src="@{/img/header-logo.png}" alt="스마트 농업 드론 방제 시스템"></span>
      <span class="dash-logo-text"><em>스마트 농업</em> 관제 시스템</span></a>

    <nav class="dash-topnav" id="gnb-menu">
      <a th:href="@{/pilot/dashboard}"
         th:classappend="${#strings.startsWith(currentUri, '/pilot/dashboard')} ? 'active'"><span class="material-icons-outlined">map</span>내 할당 필지</a>
      <a th:href="@{/pilot/history}"
         th:classappend="${#strings.startsWith(currentUri, '/pilot/history')} ? 'active'"><span class="material-icons-outlined">assignment</span>작업 관리</a>
      <a th:href="@{/pilot/assetlist}"
         th:classappend="${#strings.startsWith(currentUri, '/pilot/assetlist')} ? 'active'"><span class="material-icons-outlined">flight</span>드론 · 약제</a>
      <a th:href="@{/hazards}"
   th:classappend="${#strings.startsWith(currentUri, '/hazards')} ? 'active'"><span class="material-icons-outlined">warning_amber</span>게시판</a>
      <a th:href="@{/support}"
         th:classappend="${#strings.startsWith(currentUri, '/support')} ? 'active'"><span class="material-icons-outlined">support_agent</span>고객센터</a>
    </nav>

    <div class="dash-header-right">
        <!-- 현재 날씨 + 주의 문구 (weather.js 가 채움) -->
        <span class="gnb-weather" data-weather="header" data-weather-alert="inline">날씨 확인 중...</span>

        <span class="gnb-team" th:text="${headerTeamName} ?: '방제단 없음'">방제단</span>
        <a th:href="@{/mypage}" class="gnb-user" title="마이페이지">
          <em class="gnb-role-avatar">
            <span class="dash-avatar"><img th:src="@{/img/pilot-profile.png}" alt="조종사 프로필"></span>
            <span class="dash-role" th:text="${loginName} ?: ${roleLabel}">-</span>
          </em>
        </a>

        <form th:action="@{/logout}" method="post">
          <button type="submit" class="dash-btn-outline gnb-logout">로그아웃</button>
        </form>
    </div>
  </header>
  <!-- 날씨 안내 박스 (weather.js 가 채움) -->
  <script th:src="@{/js/common/weather.js}"></script>
  <!-- 작업 중 로그아웃 확인 팝업 -->
  <script th:src="@{/js/common/pilot-logout.js}"></script>
</th:block>
