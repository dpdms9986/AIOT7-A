<th:block th:fragment="toast">
  <!-- 로그인 직후 1번만 뜨는 팝업 (LoginSuccessHandler 의 loginMessage) -->
  <div class="login-popup-backdrop" id="login-popup" th:if="${loginMessage}">
    <div class="login-popup" role="dialog" aria-modal="true" aria-labelledby="login-popup-text">
      <div class="login-popup-icon">✓</div>
      <p id="login-popup-text" th:text="${loginMessage}">○○님, 로그인되었습니다.</p>
      <button type="button" class="login-popup-btn" id="login-popup-ok">확인</button>
    </div>
  </div>

  <script th:if="${loginMessage}">
    (() => {
      const popup = document.getElementById("login-popup");
      const close = () => popup.remove();                 // 닫으면 화면에서 제거
      document.getElementById("login-popup-ok").addEventListener("click", close);
      popup.addEventListener("click", (e) => { if (e.target === popup) close(); });   // 바깥 클릭
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter") close(); }, { once: true });
      document.getElementById("login-popup-ok").focus();  // Enter 로 바로 닫히게
    })();
  </script>
</th:block>
