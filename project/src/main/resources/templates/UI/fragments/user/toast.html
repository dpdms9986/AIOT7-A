<th:block th:fragment="toast">
  <!--
    공통 팝업
    - JS 어디서든 showPopup("메시지") 또는 showPopup("메시지", "warn") 으로 띄움
    - 서버가 보낸 1회용 메시지(flash)도 자동으로 띄움
        loginMessage  : 로그인 성공 (LoginSuccessHandler)
        signupSuccess : 회원가입 완료 (HomeController)
  -->
  <script th:inline="javascript">
    (() => {
      // 바깥 배경을 "누른 곳"과 "뗀 곳"이 모두 배경일 때만 실행
      // (팝업 안에서 누르고 드래그해 바깥에서 뗀 경우에는 닫히지 않음)
      const onBackdropClick = (backdrop, fn) => {
        let downOnBackdrop = false;
        backdrop.addEventListener("pointerdown", (e) => {
          downOnBackdrop = (e.target === backdrop);
        });
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop && downOnBackdrop) fn();
          downOnBackdrop = false;
        });
      };

      // ----- 팝업 띄우는 함수 (type: "ok" = 초록 체크, "warn" = 주황 느낌표) -----
      window.showPopup = (message, type = "ok", onClose) => {
        document.getElementById("login-popup")?.remove();   // 이미 떠 있으면 지우고 새로

        const backdrop = document.createElement("div");
        backdrop.className = "login-popup-backdrop";
        backdrop.id = "login-popup";
        backdrop.innerHTML = `
          <div class="login-popup" role="dialog" aria-modal="true">
            <div class="login-popup-icon ${type === "warn" ? "warn" : ""}">${type === "warn" ? "!" : "✓"}</div>
            <p></p>
            <button type="button" class="login-popup-btn">확인</button>
          </div>`;
        backdrop.querySelector("p").textContent = message;   // 글자는 textContent 로 (안전)
        document.body.appendChild(backdrop);

        const btn = backdrop.querySelector(".login-popup-btn");
        const onKey = (e) => { if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); close(); } };
        const close = () => {
          backdrop.remove();
          document.removeEventListener("keydown", onKey);
          if (onClose) onClose();                            // 닫은 뒤 할 일 (예: 입력칸으로 커서 이동)
        };

        // 작업 완료·취소 확인용 팝업
        window.showConfirmPopup = (form, message) => {
        document.getElementById("login-popup")?.remove();

        const backdrop = document.createElement("div");
        backdrop.className = "login-popup-backdrop";
        backdrop.id = "login-popup";

        backdrop.innerHTML = `
        <div class="login-popup" role="dialog" aria-modal="true">
        <div class="login-popup-icon">?</div>
        <p></p>
        <div class="login-popup-actions">
        <button type="button" class="login-popup-btn">확인</button>
        <button type="button" class="login-popup-cancel">취소</button>
      </div>
    </div>
  `;

        backdrop.querySelector("p").textContent = message;
        document.body.appendChild(backdrop);

        const confirmBtn = backdrop.querySelector(".login-popup-btn");
        const cancelBtn = backdrop.querySelector(".login-popup-cancel");

        const close = () => {
        backdrop.remove();
        document.removeEventListener("keydown", onKey);
      };

  const onKey = (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      close();
    }
  };

  confirmBtn.addEventListener("click", () => {
    close();
    form.submit();
  });

  cancelBtn.addEventListener("click", close);

  onBackdropClick(backdrop, close);

  document.addEventListener("keydown", onKey);
  confirmBtn.focus();

  return false;
};

        btn.addEventListener("click", close);
        onBackdropClick(backdrop, close);   // 바깥 클릭
        document.addEventListener("keydown", onKey);
          btn.focus();                                         // Enter 로 바로 닫히게
      };

      // ----- 예 / 아니오 선택 팝업 (Promise<boolean> 반환) -----
      // opts.persistent = true : 바깥 클릭 / ESC 로 닫히지 않고, 반드시 버튼을 눌러야 닫힘
      window.showAskPopup = (message, opts = {}) => {
        const { yesText = "예", noText = "아니오", detail = "", persistent = false } = opts;

        return new Promise((resolve) => {
          document.getElementById("login-popup")?.remove();

          const backdrop = document.createElement("div");
          backdrop.className = "login-popup-backdrop";
          backdrop.id = "login-popup";
          backdrop.innerHTML = `
            <div class="login-popup" role="alertdialog" aria-modal="true">
              <div class="login-popup-icon warn">!</div>
              <p class="login-popup-msg"></p>
              <p class="login-popup-sub" hidden></p>
              <div class="login-popup-actions">
                <button type="button" class="login-popup-btn" data-yes></button>
                <button type="button" class="login-popup-cancel" data-no></button>
              </div>
            </div>`;

          // 글자는 textContent 로 (안전)
          backdrop.querySelector(".login-popup-msg").textContent = message;
          if (detail) {
            const sub = backdrop.querySelector(".login-popup-sub");
            sub.textContent = detail;
            sub.hidden = false;
          }
          const yesBtn = backdrop.querySelector("[data-yes]");
          const noBtn = backdrop.querySelector("[data-no]");
          yesBtn.textContent = yesText;
          noBtn.textContent = noText;
          document.body.appendChild(backdrop);

          const onKey = (e) => {
            if (e.key !== "Escape") return;
            e.preventDefault();
            if (!persistent) done(false);          // persistent 면 ESC 무시
          };
          const done = (answer) => {
            backdrop.remove();
            document.removeEventListener("keydown", onKey, true);
            resolve(answer);
          };

          yesBtn.addEventListener("click", () => done(true));
          noBtn.addEventListener("click", () => done(false));
          if (!persistent) {
            onBackdropClick(backdrop, () => done(false));
          }
          document.addEventListener("keydown", onKey, true);
          yesBtn.focus();
        });
      };

      // ----- 기본 alert() 도 같은 팝업으로 (기존 alert("...") 코드는 안 고쳐도 됨)
      // 닫힐 때까지 기다리고 싶으면 await alert("...") 또는 alert("...").then(...) 사용
      window.alert = (message) => {
        const text = String(message ?? "");
        const type = /완료|성공|복사|보냈/.test(text) ? "ok" : "warn";   // 초록 체크 / 주황 느낌표
        return new Promise((resolve) => window.showPopup(text, type, resolve));
      };

      // ----- 폼 공통 기능 -----
      //  data-confirm="메시지"      : 제출 전 예/아니오 팝업 (기본 confirm() 대체). 중복 클릭 방지도 자동 적용
      //  data-confirm-yes="삭제"    : 확인 버튼 글자 (생략하면 "확인")
      //  data-confirm-detail="설명" : 메시지 아래 작은 설명 (선택)
      //  data-once                  : 확인 팝업 없이 중복 클릭 방지만 하고 싶을 때
      //  data-select-gate           : 필수 select 를 고르기 전에는 제출 버튼 비활성화
      const syncGate = (form) => {
        if (form.dataset.submitting === "1") return;
        const sel = form.querySelector("select[required]");
        const btn = form.querySelector('button[type="submit"]');
        if (sel && btn) btn.disabled = sel.disabled || !sel.value;
      };

      let formBusy = false;   // 어떤 폼이든 제출이 시작되면 true (다른 폼/버튼 클릭도 막음)

      const lockForm = (form) => {
        formBusy = true;
        form.dataset.submitting = "1";

        // 이동하는 동안 화면 전체를 투명 막으로 덮어 아무것도 못 누르게 함
        if (!document.getElementById("form-busy-overlay")) {
          const ov = document.createElement("div");
          ov.id = "form-busy-overlay";
          document.body.appendChild(ov);
        }

        // 안전장치: 15초가 지나도 페이지가 안 넘어가면 잠금 해제
        setTimeout(() => unlockForm(form), 15000);

        setTimeout(() => {   // 제출 데이터가 만들어진 뒤에 잠가야 함
          form.querySelectorAll('button[type="submit"], button:not([type]), input[type="submit"]').forEach((b) => {
            b.disabled = true;
            b.dataset.locked = "1";
            if (b.tagName === "BUTTON") {
              b.dataset.origHtml = b.innerHTML;
              b.textContent = "처리 중...";
            }
          });
        }, 0);
      };

      const unlockForm = (form) => {
        formBusy = false;
        document.getElementById("form-busy-overlay")?.remove();
        delete form.dataset.submitting;
        form.querySelectorAll("[data-locked]").forEach((b) => {
          b.disabled = false;
          delete b.dataset.locked;
          if (b.dataset.origHtml) { b.innerHTML = b.dataset.origHtml; delete b.dataset.origHtml; }
        });
        syncGate(form);
      };

      document.addEventListener("submit", async (e) => {
        const form = e.target;
        if (!(form instanceof HTMLFormElement)) return;

        // 이미 제출 중이거나 확인 팝업이 떠 있으면 추가 제출 무시
        if (formBusy || form.dataset.submitting === "1" || form.dataset.asking === "1") {
          e.preventDefault();
          return;
        }

        const msg = form.dataset.confirm;
        if (msg && form.dataset.confirmed !== "1") {
          e.preventDefault();
          form.dataset.asking = "1";
          const ok = await window.showAskPopup(msg, {
            yesText: form.dataset.confirmYes || "확인",
            noText: "취소",
            detail: form.dataset.confirmDetail || "",
          });
          delete form.dataset.asking;
          if (!ok) return;
          form.dataset.confirmed = "1";
          if (form.requestSubmit) form.requestSubmit(e.submitter); else form.submit();
          return;
        }

        delete form.dataset.confirmed;
        if (msg || form.hasAttribute("data-once")) lockForm(form);
      });

      document.addEventListener("change", (e) => {
        const form = e.target.closest ? e.target.closest("form[data-select-gate]") : null;
        if (form) syncGate(form);
      });

      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("form[data-select-gate]").forEach(syncGate);
      });

      // 뒤로가기로 돌아왔을 때 잠긴 버튼 풀기
      window.addEventListener("pageshow", (e) => {
        if (!e.persisted) return;
        document.querySelectorAll('form[data-submitting="1"]').forEach(unlockForm);
        document.querySelectorAll("form[data-select-gate]").forEach(syncGate);
      });

      // ----- 서버가 보낸 1회용 메시지 자동 표시 -----
      const loginMessage  = /*[[${loginMessage}]]*/ null;
      const signupSuccess = /*[[${signupSuccess}]]*/ false;

      // ----- 자산 관리 계시판 -----
      const message = /*[[${message}]]*/ null;
      const error = /*[[${error}]]*/ null
      const assetRegistered = /*[[${assetRegistered}]]*/ false;

      // 위험 구역 메시지 추가
      const successMessage = /*[[${successMessage}]]*/ null;
      const errorMessage = /*[[${errorMessage}]]*/ null;

      // ----- [조종사] 로그인 직후: 중단된 작업 확인 -----
      const isPilot = (/*[[${roleLabel}]]*/ null) === "조종사";

      // 중단/재배정 작업이 있으면 팝업을 띄우고 true, 없으면 false
      const checkInterruptedWork = async () => {
        try {
          const res = await fetch("/api/pilot/assignments/interrupted", {
            headers: { "Accept": "application/json" },
          });
          if (!res.ok) return false;

          const list = await res.json();
          if (!Array.isArray(list) || list.length === 0) return false;

          // 이어서 할 수 있는 중단 작업을 우선 안내
          const item = list.find((w) => w.canResume) || list[0];

          if (item.canResume) {
            const hasPos = item.lastLatitude != null && item.lastLongitude != null;
            const pos = hasPos
              ? `마지막 위치: 위도 ${Number(item.lastLatitude).toFixed(6)}, 경도 ${Number(item.lastLongitude).toFixed(6)}`
              : "마지막 위치 정보가 없습니다.";

            const yes = await showAskPopup(item.message, {
              detail: item.address ? `${item.address}\n${pos}` : pos,
              yesText: "예",
              noText: "아니오",
              persistent: true,                      // 바깥 클릭 / ESC 로 닫히지 않음
            });

            // 예 → 작업 관리 페이지로 이동 / 아니오 → 팝업만 닫힘
            if (yes) location.href = "/pilot/history?no=" + item.assignmentNo;
          } else {
            // 다른 조종사에게 재배정된 작업 안내
            // [확인]을 눌러 팝업이 닫힐 때 "확인했음"을 서버에 저장 → 다음 로그인부터 안 뜸
            showPopup(item.message, "warn", () => {
              const token  = document.querySelector('meta[name="_csrf"]')?.content;
              const header = document.querySelector('meta[name="_csrf_header"]')?.content;

              fetch(`/api/pilot/assignments/${item.assignmentNo}/reassignment-notice/read`, {
                method: "PATCH",
                headers: token && header ? { [header]: token } : {},
              }).catch(() => {});   // 실패해도 화면엔 영향 없음 (다음 로그인에 다시 뜰 뿐)
            });
          }
          return true;
        } catch (e) {
          return false;
        }
      };

      document.addEventListener("DOMContentLoaded", () => {
      if (loginMessage) {
      showPopup(loginMessage);

      } else if (signupSuccess) {
      showPopup("회원가입이 완료되었습니다. 로그인해 주세요.");

       // 위험 구역 메시지
      } else if (errorMessage) {
       showPopup(errorMessage, "warn");
       } else if (successMessage) {
       showPopup(successMessage);

       // 자산 관리 메시지
      } else if (error) {
      showPopup(error, "warn");
      } else if (message) {
      showPopup(message);
      } else if (assetRegistered) {
        showPopup("자산이 등록되었습니다.");
       
        } else {
        try {
           const pending = sessionStorage.getItem("loginPopup");
            if (pending) {
            sessionStorage.removeItem("loginPopup");

            // 조종사는 중단된 작업이 있으면 로그인 팝업 대신 중단 안내 팝업
            if (isPilot) {
              checkInterruptedWork().then((shown) => { if (!shown) showPopup(pending); });
            } else {
              showPopup(pending);
            }
      }
      } catch (e) {}
      }
    });
    })();
  </script>
</th:block>
