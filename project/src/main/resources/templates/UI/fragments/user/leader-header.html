<th:block th:fragment="header">
    <header class="dash-header">
      <a th:href="@{/}" class="dash-logo" title="스마트 농업 관제 시스템"><span class="dash-logo-img">
        <img th:src="@{/img/header-logo.png}" alt="스마트 농업 드론 방제 시스템"></span>
        <span class="dash-logo-text"><em>스마트 농업</em> 관제 시스템</span></a>

      <!-- 현재 주소로 시작하면 active -->
      <nav class="dash-topnav" id="gnb-menu">
        <a th:href="@{/leader/dashboard}"
           th:classappend="${#strings.startsWith(currentUri, '/leader/dashboard')} ? 'active'"><span class="material-icons-outlined">home</span>관제 대시보드</a>
        <a th:href="@{/leader/farmlist}"
           th:classappend="${#strings.startsWith(currentUri, '/leader/farmlist')} ? 'active'"><span class="material-icons-outlined">landscape</span>농지 관리</a>
        <a th:href="@{/leader/task-assignment}"
           th:classappend="${#strings.startsWith(currentUri, '/leader/task-assignment')} ? 'active'"><span class="material-icons-outlined">assignment</span>작업 배정</a>
        <a th:href="@{/leader/team-management}"
           th:classappend="${#strings.startsWith(currentUri, '/leader/team-management')} ? 'active'"><span class="material-icons-outlined">groups</span>방제단 관리</a>
        <a th:href="@{/leader/assetlist}"
           th:classappend="${#strings.startsWith(currentUri, '/leader/assetlist')} ? 'active'"><span class="material-icons-outlined">flight</span>드론 · 약제</a>
        <a th:href="@{/hazards}"
   th:classappend="${#strings.startsWith(currentUri, '/hazards')} ? 'active'"><span class="material-icons-outlined">warning_amber</span>게시판</a>
        <a th:href="@{/support}"
           th:classappend="${#strings.startsWith(currentUri, '/support')} ? 'active'"><span class="material-icons-outlined">support_agent</span>고객센터</a>
      </nav>

      <div class="dash-header-right">
          <!-- 현재 날씨 (weather.js 가 채움) -->
          <span class="gnb-weather" data-weather="header">날씨 확인 중...</span>

          <!-- 방제단 이름 + 초대 코드 (세로로 쌓기) -->
          <div class="gnb-team-stack">
          <span class="gnb-team" th:text="${headerTeamName} ?: '방제단 없음'">방제단</span>

          <!-- 단장만: 초대코드 (클릭하면 복사) -->
          <button type="button" class="gnb-invite" id="invite-btn"
                  title="초대 코드 복사" aria-label="초대 코드 복사"
                  th:if="${headerInviteCode != null}">
            <span class="gnb-invite-text">초대 코드 <b id="invite-code" th:text="${headerInviteCode}">------</b></span>
            <span class="gnb-invite-icon">📋</span>
          </button>
          </div>

          <a th:href="@{/mypage}" class="gnb-user" title="마이페이지">
            <em class="gnb-role-avatar">
              <span class="dash-avatar"><img th:src="@{/img/leader-profile.png}" alt="방제단장 프로필"></span>
              <span class="dash-role" th:text="${loginName} ?: ${roleLabel}">-</span>
            </em>
          </a>

          <form th:action="@{/logout}" method="post">
            <button type="submit" class="dash-btn-outline gnb-logout">로그아웃</button>
          </form>
      </div>
    </header>

    <script th:src="@{/js/common/weather.js}"></script>
    
    <!-- 헤더 초대코드 복사 -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const btn = document.querySelector("#invite-btn");
        btn?.addEventListener("click", async () => {
          const code = document.querySelector("#invite-code").textContent.trim();
          try { await navigator.clipboard.writeText(code); alert(`초대 코드 ${code} 가 복사되었습니다.`); }
          catch (e) { alert(`초대 코드: ${code}`); }
        });
      });
    </script>
</th:block>
