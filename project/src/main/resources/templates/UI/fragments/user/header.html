<th:block th:fragment="header">
    <header class="dash-header dash-header-main">

      <!-- 로고 (단장/조종사 헤더와 동일) -->
      <a th:href="@{/}" class="dash-logo" title="스마트 농업 관제 시스템">
        <span class="dash-logo-img">
          <img th:src="@{/images/header-logo.png}" alt="스마트 농업 드론 방제 시스템">
        </span>
        <span class="dash-logo-text"><em>스마트 농업</em> 관제 시스템</span>
      </a>

      <!-- 메뉴: 현재 주소면 active -->
      <nav class="dash-topnav" id="gnb-menu">
        <a th:href="@{/intro}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/intro')} ? 'active'"><span class="material-icons-outlined">info</span>시스템 소개</a>
        <a th:href="@{/features}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/features')} ? 'active'"><span class="material-icons-outlined">widgets</span>주요 기능</a>
        <a th:href="@{/guide}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/guide')} ? 'active'"><span class="material-icons-outlined">help_outline</span>이용 안내</a>
      </nav>

      <div class="dash-header-right">

        <!-- 🔐 로그인 ❌ -->
        <th:block sec:authorize="isAnonymous()">
          <a th:href="@{/signup}" class="gnb-signup">회원가입</a>
          <a th:href="@{/login}" class="gnb-login">로그인</a>
        </th:block>

        <!-- 🔐 로그인 ⭕ : 내 대시보드로 가기, 로그아웃 -->
        <th:block sec:authorize="isAuthenticated()">
          <a th:href="@{/leader/dashboard}" class="gnb-dash"
             sec:authorize="hasRole('LEADER')">🌱 우리 농지 관제</a>
          <a th:href="@{/pilot/dashboard}" class="gnb-dash"
             sec:authorize="hasRole('PILOT')">🌱 오늘의 작업</a>
          <a th:href="@{/admin}" class="gnb-dash"
             sec:authorize="hasRole('ADMIN')">🛠 관리자 페이지</a>

          <form th:action="@{/logout}" method="post">
            <button type="submit" class="dash-btn-outline gnb-logout">로그아웃</button>
          </form>
        </th:block>

      </div>
    </header>
</th:block>
