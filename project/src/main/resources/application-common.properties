# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# 파일 업로드 설정 - 파일업로드 용량 정책 확인하기
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# Logging 설정
# logging.level.<패키지명> = TRACE | DEBUG | INFO | WARN | ERROR | OFF
logging.level.com.aloha.proejct=INFO
logging.level.root=DEBUG


# Email Configuration (Gmail 기준)
# Gmail 앱 비밀번호 생성 방법:
# 1. Google 계정 관리 > 보안 > 2단계 인증 사용 설정
# 2. 앱 비밀번호 생성 후 아래 password 필드에 입력
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=구글아이디
spring.mail.password=앱비밀번호
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8