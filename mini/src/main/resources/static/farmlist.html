<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농지 관리</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-body">
    <header class="dash-header">
        <a href="#" class="dash-logo"><span>🌱</span>스마트 농업 관제 시스템</a>
        <nav class="dash-topnav" id="gnb-menu"></nav>
        <div class="dash-header-right">
            <span class="gnb-team" id="team-name">방제단</span>
            <button type="button" class="gnb-invite" id="invite-btn" hidden>초대 코드 <b id="invite-code">------</b> 📋</button>
            <span class="dash-role" id="user-role">-</span>
            <a href="mypage.html" class="gnb-user" title="마이페이지"><span class="dash-avatar">👤</span><span id="user-name">사용자</span></a>
            <button type="button" class="dash-btn-outline gnb-logout" id="logout-btn">로그아웃</button>
        </div>
    </header>

    <div class="dash-layout">

        <aside class="dash-sidebar">
            <nav class="dash-sidenav" id="gnb-side"></nav>

            <div class="dash-side-promo">
                <strong>🌱 더 스마트한<br>농업의 시작</strong>
                데이터로 만드는 건강한 농작물,<br>지속 가능한 농업을 실현합니다.
            </div>
        </aside>

    <main class="app-layout">
        <div class="main-content">

            <!-- 농지 목록 -->
            <section id="farm-list" class="tab-content">
                <div class="farm-page-title">
                    <h1>농지 관리</h1>
                </div>

                <p class="page-description">
                    등록된 농지의 현황을 확인하고 관리합니다.
                </p>

                <!-- 검색 필터 -->
                <div class="filter-card">
                    <div class="filter-group">
                        <label for="region-filter">행정구역</label>
                        <select id="region-filter">
                            <option value="">전체 행정구역</option>
                            <option value="유성구">유성구</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="status-filter">상태</label>
                        <select id="status-filter">
                            <option value="">전체 상태</option>
                            <option value="대기">대기</option>
                        </select>
                    </div>

                    <div class="filter-group search-group">
                        <label for="farm-search">검색</label>
                        <input
                            type="search"
                            id="farm-search"
                            placeholder="주소 또는 행정구역 검색"
                        >
                    </div>

                    <button type="button" id="search-button" class="button">
                        검색
                    </button>

                    <button
                        type="button"
                        id="register-button"
                        class="button primary-button"
                    >
                        + 농지 등록
                    </button>
                </div>

                <!-- 농지 목록 테이블 -->
                <div class="table-card">
                    <div class="table-heading">
                        <h2>농지 목록</h2>
                        <span>총 <strong id="farm-count">2</strong>건</span>
                    </div>

                    <div class="table-scroll">
                        <table class="farm-table">
                            <thead>
                                <tr>
                                    <th>선택</th>
                                    <th>주소</th>
                                    <th>면적(㎡)</th>
                                    <th>행정구역</th>
                                    <th>상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr data-farm-id="1">
                                    <td>
                                        <input
                                            type="checkbox"
                                            class="farm-select"
                                            aria-label="전민동 농지 선택"
                                        >
                                    </td>
                                    <td>전민동 15-2</td>
                                    <td>800</td>
                                    <td>유성구</td>
                                    <td>
                                        <span class="status-badge">대기</span>
                                    </td>
                                    <td>
                                        <button
                                            type="button"
                                            class="button detail-button"
                                            data-farm-id="1"
                                        >
                                            상세
                                        </button>
                                    </td>
                                </tr>

                                <tr data-farm-id="2">
                                    <td>
                                        <input
                                            type="checkbox"
                                            class="farm-select"
                                            aria-label="노은동 농지 선택"
                                        >
                                    </td>
                                    <td>노은동 2-8</td>
                                    <td>600</td>
                                    <td>유성구</td>
                                    <td>
                                        <span class="status-badge">대기</span>
                                    </td>
                                    <td>
                                        <button
                                            type="button"
                                            class="button detail-button"
                                            data-farm-id="2"
                                        >
                                            상세
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 농지 상세 -->
            <section id="farm-detail" class="tab-content" hidden>
                <div class="detail-header">
                    <div>
                        <div class="breadcrumb">
                            홈　/　농지 관리　/　농지 상세
                        </div>
                        <h1>농지 상세 정보</h1>
                    </div>

                    <button
                        type="button"
                        class="button"
                        id="back-to-list"
                    >
                        목록으로 돌아가기
                    </button>
                </div>

                <dl class="farm-info">
                    <dt>주소</dt>
                    <dd id="detail-address">-</dd>

                    <dt>면적</dt>
                    <dd id="detail-area">-</dd>

                    <dt>행정구역</dt>
                    <dd id="detail-region">-</dd>

                    <dt>상태</dt>
                    <dd id="detail-status">-</dd>
                </dl>

                <h2 class="section-title">작업 이력</h2>

                <div class="history-placeholder">
                    작업 이력은 추후 연결
                </div>
            </section>

        </div>
    </main>
    </div>

    <script src="js/common.js"></script>
</body>
</html>
