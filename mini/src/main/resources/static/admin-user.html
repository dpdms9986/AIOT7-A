<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 계정 관리 | 스마트 농업 관제 시스템</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/admin-user.css">
</head>
<body class="dash-body admin-user-page" data-role="ADMIN">

  <!-- ===== 공통 헤더 ===== -->
  <header class="dash-header">
      <a href="#" class="dash-logo"><span>🌱</span>스마트 농업 관제 시스템</a>
    <nav class="dash-topnav" id="gnb-menu"></nav>
      <div class="dash-header-right">
        <span class="gnb-team" id="team-name">방제단</span>
        <button type="button" class="gnb-invite" id="invite-btn" hidden>초대 코드 <b id="invite-code">------</b> 📋</button>
        <span class="dash-role" id="user-role">-</span>
        <a href="mypage.html" class="gnb-user" title="마이페이지"><span class="dash-avatar">👤</span><span id="user-name">사용자</span></a>
        <button type="button" class="dash-btn-outline gnb-logout" id="logout-btn">로그아웃</button>
      </div>
  </header>

  <div class="dash-layout">

    <!-- ===== 왼쪽 사이드바 ===== -->
   <aside class="dash-sidebar">
    <nav class="dash-sidenav" id="gnb-side" aria-label="사이드 메뉴">
    </nav>

    <div class="dash-side-promo">
        <strong>🌱 더 스마트한 농업의 시작</strong>
        <p>데이터로 만드는 건강한 농작물, 스마트 농업 관제 시스템</p>
    </div>
</aside>

        <main class="main-content admin-user-main">

            <section class="admin-user-heading">
                <div>
                    <h1>관리자 계정 관리</h1>
                    <p>시스템 사용자의 계정과 권한을 관리합니다.</p>
                </div>

                <div class="admin-user-actions">
                    <button type="button" id="add-user-btn"
                            class="admin-user-btn primary">
                        + 사용자 추가
                    </button>

                    <button type="button" id="export-users-btn"
                            class="admin-user-btn">
                        엑셀 다운로드
                    </button>
                </div>
            </section>

            <section class="admin-user-filter">
                <form id="user-filter-form">

                    <input type="search" id="user-search"
                           placeholder="이름 또는 이메일로 검색">

                    <select id="role-filter">
                        <option value="">전체 역할</option>
                        <option value="LEADER">방제단장</option>
                        <option value="PILOT">조종사</option>
                        <option value="ADMIN">관리자</option>
                    </select>

                    <select id="status-filter">
                        <option value="">전체 상태</option>
                        <option value="ACTIVE">활성</option>
                        <option value="INACTIVE">비활성</option>
                    </select>

                    <button type="submit"
                            class="admin-user-btn primary">검색</button>

                    <button type="button" id="reset-filter-btn"
                            class="admin-user-btn">초기화</button>
                </form>
            </section>

            <section class="admin-user-summary">

                <article class="admin-user-summary-card">
                    <span class="summary-icon green">♙</span>
                    <div>
                        <p>전체 계정</p>
                        <strong id="count-all">0명</strong>
                    </div>
                </article>

                <article class="admin-user-summary-card">
                    <span class="summary-icon blue">♟</span>
                    <div>
                        <p>방제단장</p>
                        <strong id="count-leader">0명</strong>
                    </div>
                </article>

                <article class="admin-user-summary-card">
                    <span class="summary-icon orange">♧</span>
                    <div>
                        <p>조종사</p>
                        <strong id="count-pilot">0명</strong>
                    </div>
                </article>

                <article class="admin-user-summary-card">
                    <span class="summary-icon purple">⚙</span>
                    <div>
                        <p>관리자</p>
                        <strong id="count-admin">0명</strong>
                    </div>
                </article>

            </section>

            <section class="admin-user-table-card">

                <div class="admin-user-table-heading">
                    <strong>계정 목록</strong>
                    <span id="user-result-count">0명</span>
                </div>

                <div class="admin-user-table-scroll">
                    <table class="admin-user-table">
                        <thead>
                            <tr>
                                <th>이름</th>
                                <th>이메일</th>
                                <th>연락처</th>
                                <th>역할</th>
                                <th>소속 방제단</th>
                                <th>계정 상태</th>
                                <th>최근 접속일</th>
                                <th>관리</th>
                            </tr>
                        </thead>

                        <tbody id="user-table-body"></tbody>
                    </table>
                </div>

                <p id="user-empty" hidden>
                    검색 조건에 맞는 계정이 없습니다.
                </p>

                <nav id="user-pagination" class="admin-user-pagination"></nav>
            </section>

        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/admin-user.js"></script>

</body>
</html>
