<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계정 찾기</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/users.css">
</head>
<body>
  <main class="findaccount-page">
    <section class="findaccount-card">
      <div class="findaccount-tabs" role="tablist" aria-label="계정 찾기 유형">
        <button type="button" class="active" data-tab="id" role="tab" aria-selected="true">아이디 찾기</button>
        <button type="button" data-tab="password" role="tab" aria-selected="false">비밀번호 찾기</button>
      </div>
      <form class="findaccount-form" id="findaccount-form">
        <div class="findaccount-field" data-field="name">
          <label for="find-name">이름</label>
          <input id="find-name" type="text" name="name" placeholder="이름" required>
        </div>
        <div class="findaccount-field" data-field="userid" hidden>
          <label for="find-userid">아이디</label>
          <input id="find-userid" type="text" name="userid" placeholder="아이디">
        </div>
        <div class="findaccount-field">
          <label for="find-email">이메일</label>
          <input id="find-email" type="email" name="email" placeholder="이메일" required>
        </div>
        <button class="findaccount-submit" type="submit" id="findaccount-submit">아이디 찾기</button>
      </form>
      <div class="findaccount-footer"><a href="login.html">로그인으로 돌아가기</a></div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
